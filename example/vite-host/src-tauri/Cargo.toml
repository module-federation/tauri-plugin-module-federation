[package]
name = "vite-host-app"
version = "0.1.0"
description = "Example Tauri host built with Vite"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vite_host_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-module-federation = { path = "../../../packages/tauri-plugin" }
example-tauri-e2e = { path = "../../tauri-e2e" }
