[package]
name = "tauri-plugin-module-federation"
version = "1.0.1"
authors = ["Néstor López <nestor@nstlopez.com>"]
license = "MIT"
description = "Tauri plugin for Module Federation remote loading and offline cache fallback."
readme = "README.md"
homepage = "https://github.com/module-federation/tauri-plugin-module-federation"
repository = "https://github.com/module-federation/tauri-plugin-module-federation"
edition = "2021"
rust-version = "1.70"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-module-federation"

[dependencies]
tauri = "2.10"
serde = "1.0"
thiserror = "1.0"
reqwest = "0.12.5"
log = "0.4"
url = "2.5.2"
form_urlencoded = "1.2.1"
base64 = "0.22.1"
sha = "1.0.3"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }
