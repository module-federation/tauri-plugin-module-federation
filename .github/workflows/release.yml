name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        type: choice
        required: true
        default: next
        options: [latest, next]
      branch:
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-module-federation-tauri
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publish
    env:
      NPM_PACKAGE: "@module-federation/tauri"
      CARGO_PACKAGE: tauri-plugin-module-federation
      CARGO_MANIFEST: packages/tauri-plugin/Cargo.toml
    steps:
      - name: Validate manual target
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: test "$RELEASE_BRANCH" = "main" || { echo "Releases are main-only."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.branch }}
      - name: Verify source branch
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || { echo "Source is not on main."; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "${RELEASE_TAG#v}" = "$RELEASE_TAG" || { echo "Tags must not start with v."; exit 1; }
          test "$(node -p "require('./packages/tauri/package.json').version")" = "$RELEASE_TAG" || { echo "Tag/version mismatch."; exit 1; }
          pnpm release:sync:check || { echo "Cargo version does not match packages/tauri/package.json."; exit 1; }
      - name: Generate preview version
        if: github.event_name == 'workflow_dispatch' && inputs.version == 'next'
        run: |
          BASE_VERSION="$(node -p "require('./packages/tauri/package.json').version.split('-')[0]")"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          npm pkg set version="${MAJOR}.${MINOR}.$((PATCH + 1))-next.${GITHUB_RUN_ID}" --prefix packages/tauri
          pnpm release:sync
      - name: Verify release artifacts
        run: |
          pnpm build
          pnpm pack:tauri
      - name: Compute dist-tag
        id: dist
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          TAG=latest
          if [ "$INPUT_VERSION" = "next" ] || [ "$PRERELEASE" = "true" ]; then TAG=next; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Refuse conflicting npm republish
        id: npm-check
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          VERSION="$(node -p "require('./packages/tauri/package.json').version")"
          EXISTING="$(npm view "$NPM_PACKAGE@$VERSION" version --json 2>/dev/null || true)"
          EXISTING="${EXISTING#\"}"; EXISTING="${EXISTING%\"}"
          if [ "$EXISTING" = "$VERSION" ]; then
            CURRENT="$(npm view "$NPM_PACKAGE" "dist-tags.$DIST_TAG" --json 2>/dev/null || true)"
            CURRENT="${CURRENT#\"}"; CURRENT="${CURRENT%\"}"
            test "$CURRENT" = "$VERSION" || { echo "Existing version has conflicting dist-tag."; exit 1; }
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check crates.io
        id: cargo-check
        run: |
          VERSION="$(node -p "require('./packages/tauri/package.json').version")"
          STATUS="$(curl -s -o /tmp/crate.json -w '%{http_code}' -A "github.com/${GITHUB_REPOSITORY}" "https://crates.io/api/v1/crates/$CARGO_PACKAGE/$VERSION")"
          case "$STATUS" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response: $STATUS"; cat /tmp/crate.json; exit 1 ;;
          esac
      - name: Publish to npm
        if: steps.npm-check.outputs.publish == 'true'
        working-directory: packages/tauri
        run: npm publish --provenance --tag "${{ steps.dist.outputs.tag }}" --access public
      - name: Publish to crates.io
        if: steps.cargo-check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path "$CARGO_MANIFEST" --allow-dirty --no-verify
