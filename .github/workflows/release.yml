name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        type: choice
        required: true
        default: next
        options: [latest, next]
      branch:
        required: true
        default: main
      release_tag:
        description: Exact release tag to publish (used by Release Please)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-module-federation-tauri
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publish
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      NPM_PACKAGE: "@module-federation/tauri"
    steps:
      - name: Validate manual target
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.version }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
        run: |
          test "$RELEASE_BRANCH" = "$WORKFLOW_BRANCH" || { echo "Workflow and source must use the same branch."; exit 1; }
          if [ "$RELEASE_BRANCH" != "main" ] && { [ "$RELEASE_CHANNEL" != "next" ] || [ -n "$RELEASE_TAG" ]; }; then
            echo "Branch previews must use next without a release tag."
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_CHANNEL" != "latest" ]; then
            echo "An exact release tag cannot generate a preview version."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag || inputs.branch }}
      - name: Verify source branch
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_CHANNEL: ${{ inputs.version }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$RELEASE_CHANNEL" = "next" ] && [ "$RELEASE_BRANCH" != "main" ]; then
            git merge-base --is-ancestor origin/main HEAD || { echo "Preview branch must include current main."; exit 1; }
          else
            git merge-base --is-ancestor HEAD origin/main || { echo "Source is not on main."; exit 1; }
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.10.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          test "${RELEASE_TAG#v}" = "$RELEASE_TAG" || { echo "Tags must not start with v."; exit 1; }
          test "$(node -p "require('./packages/tauri/package.json').version")" = "$RELEASE_TAG" || { echo "Tag/version mismatch."; exit 1; }
          pnpm release:sync:check || { echo "Cargo version does not match packages/tauri/package.json."; exit 1; }
      - name: Generate preview version
        if: github.event_name == 'workflow_dispatch' && inputs.version == 'next'
        run: |
          BASE_VERSION="$(node -p "require('./packages/tauri/package.json').version.split('-')[0]")"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          npm pkg set version="${MAJOR}.${MINOR}.$((PATCH + 1))-next.${GITHUB_RUN_ID}" --prefix packages/tauri
          pnpm release:sync
      - name: Read release version and source
        id: version
        run: |
          echo "version=$(node -p "require('./packages/tauri/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify release artifacts
        run: |
          pnpm release:sync:check
          cargo fmt --all --check
          pnpm build:ci
          cargo test -p tauri-plugin-module-federation --locked
          pnpm pack:tauri
      - name: Compute dist-tag
        id: dist
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG=latest
          if [ "$INPUT_VERSION" = "next" ] || [ "$PRERELEASE" = "true" ] || [[ "$RELEASE_VERSION" == *-* ]]; then TAG=next; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Refuse conflicting npm republish
        id: npm-check
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          VERSION="$(node -p "require('./packages/tauri/package.json').version")"
          EXISTING="$(npm view "$NPM_PACKAGE@$VERSION" version --json 2>/dev/null || true)"
          EXISTING="${EXISTING#\"}"; EXISTING="${EXISTING%\"}"
          if [ "$EXISTING" = "$VERSION" ]; then
            CURRENT="$(npm view "$NPM_PACKAGE" "dist-tags.$DIST_TAG" --json 2>/dev/null || true)"
            CURRENT="${CURRENT#\"}"; CURRENT="${CURRENT%\"}"
            test "$CURRENT" = "$VERSION" || { echo "Existing version has conflicting dist-tag."; exit 1; }
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npm-check.outputs.publish == 'true'
        working-directory: packages/tauri
        run: npm publish --tag "${{ steps.dist.outputs.tag }}" --access public

  publish-crate:
    needs: publish
    if: vars.CARGO_PUBLISH_ENABLED == 'true' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: Publish
    env:
      CARGO_PACKAGE: tauri-plugin-module-federation
      CARGO_MANIFEST: packages/tauri-plugin/Cargo.toml
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Sync release version
        run: |
          npm pkg set version="$RELEASE_VERSION" --prefix packages/tauri
          node scripts/sync-release-version.mjs
          node scripts/sync-release-version.mjs --check
      - name: Check crates.io
        id: cargo-check
        run: |
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/crate.json" --write-out '%{http_code}' --user-agent "github.com/${GITHUB_REPOSITORY}" "https://crates.io/api/v1/crates/$CARGO_PACKAGE/$RELEASE_VERSION")"
          case "$STATUS" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response: $STATUS"; cat "$RUNNER_TEMP/crate.json"; exit 1 ;;
          esac
      - name: Verify Cargo package
        if: steps.cargo-check.outputs.publish == 'true'
        run: cargo publish --dry-run --manifest-path "$CARGO_MANIFEST" --allow-dirty --locked
      - name: Authenticate with crates.io through OIDC
        if: steps.cargo-check.outputs.publish == 'true'
        id: cargo-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.cargo-check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}
        run: cargo publish --manifest-path "$CARGO_MANIFEST" --allow-dirty --locked --no-verify
